on:
  cli:
    init:
      ref: ${{ event.git.sha }}
  github:
    push:
      if: ${{ event.git.branch == 'main' }}
      init:
        ref: ${{ event.git.sha }}
    pull_request:
      init:
        ref: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.0.0

tasks:
  # --- Clone ---
  - key: clone
    call: git/clone 2.0.6
    with:
      repository: https://github.com/geekflyer/cliprelay.git
      ref: ${{ init.ref }}
      github-token: ${{ github.token }}
      preserve-git-dir: true

  # --- Android pipeline ---
  - key: setup-android
    use: [clone]
    run: |
      sudo apt-get update -qq
      sudo apt-get install -y -qq openjdk-17-jdk
      echo "/usr/lib/jvm/java-17-openjdk-amd64" > $RWX_ENV/JAVA_HOME

      export ANDROID_HOME="$HOME/android-sdk"
      mkdir -p "$ANDROID_HOME/cmdline-tools"
      cd /tmp
      curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
      unzip -q cmdline-tools.zip
      mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
      yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      echo "$ANDROID_HOME" > $RWX_ENV/ANDROID_HOME

  - key: test-android
    use: [setup-android]
    run: cd android && ./gradlew testDebugUnitTest

  - key: build-android
    use: [test-android]
    run: ./scripts/build-all.sh --android-only

  # --- macOS pipeline ---
  # TODO: RWX does not currently support macOS runners.
  # The test-build-mac job (swift test + build) requires macOS with Xcode.
  # This job must remain in GitHub Actions or be migrated when RWX adds macOS support.
  # Original steps:
  #   - swift test --package-path macos/ClipRelayMac
  #   - ./scripts/build-all.sh --mac-only
