name: Release macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (stable X.Y.Z on main, or X.Y.Z-beta.N on beta)'
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    environment: prod
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve channel from branch
        id: channel
        run: |
          BR="${{ github.ref_name }}"
          case "$BR" in
            main)
              echo "channel=stable" >> "$GITHUB_OUTPUT"
              echo "tag_prefix=mac/v" >> "$GITHUB_OUTPUT"
              ;;
            beta)
              echo "channel=beta" >> "$GITHUB_OUTPUT"
              echo "tag_prefix=mac/beta/v" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Error: Release macOS is only supported from branches main or beta (currently '$BR')." >&2
              exit 1
              ;;
          esac

      - name: Validate version for channel
        run: |
          V="${{ inputs.version }}"
          CH='${{ steps.channel.outputs.channel }}'
          if [[ "$CH" == stable ]]; then
            if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Error: Stable version must be semver X.Y.Z (no pre-release suffix)." >&2
              exit 1
            fi
          else
            if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'; then
              echo "Error: Beta version must be X.Y.Z-beta.N (e.g. 1.2.0-beta.3)." >&2
              exit 1
            fi
          fi

      - name: Set version
        id: version
        run: echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Verify tag does not exist
        run: |
          TAG="${{ steps.channel.outputs.tag_prefix }}${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Error: Tag $TAG already exists" >&2
            exit 1
          fi

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CERTIFICATE_P12: op://cliprelay/macOS Signing Certificate/p12-base64
          CERTIFICATE_PASSWORD: op://cliprelay/macOS Signing Certificate/password
          NOTARY_APPLE_ID: op://cliprelay/macOS Notarization/apple-id
          NOTARY_PASSWORD: op://cliprelay/macOS Notarization/password
          NOTARY_TEAM_ID: op://cliprelay/macOS Notarization/team-id
          SPARKLE_PRIVATE_KEY: op://cliprelay/Sparkle Update Signing/private-key
          SPARKLE_PUBLIC_KEY: op://cliprelay/Sparkle Update Signing/public-key

      - name: Import signing certificate
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm certificate.p12

      - name: Store notarization credentials
        run: |
          xcrun notarytool store-credentials "ClipRelay" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build
        run: |
          CH='${{ steps.channel.outputs.channel }}'
          if [[ "$CH" == beta ]]; then
            ./scripts/build-all.sh --mac-only --beta-mac
          else
            ./scripts/build-all.sh --mac-only
          fi

      - name: Sign, notarize, and create DMG
        run: ./scripts/publish-mac.sh --wait

      - name: Generate changelog
        id: changelog
        run: |
          CH='${{ steps.channel.outputs.channel }}'
          if [[ "$CH" == stable ]]; then
            PREV=$(git tag -l 'mac/v*' --sort=-v:refname | head -1 || true)
          else
            PREV=$(git tag -l 'mac/beta/v*' --sort=-v:refname | head -1 || true)
          fi
          if [[ -n "$PREV" ]]; then
            BODY=$(./scripts/changelog.sh --mac "${PREV}..HEAD")
          else
            BODY="- Initial release"
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          TAG="${{ steps.channel.outputs.tag_prefix }}${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "macOS release ${{ steps.channel.outputs.channel }} ${{ steps.version.outputs.version }}"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.channel.outputs.tag_prefix }}${{ steps.version.outputs.version }}
          name: ${{ steps.channel.outputs.channel == 'beta' && format('macOS beta v{0}', steps.version.outputs.version) || format('macOS v{0}', steps.version.outputs.version) }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ steps.channel.outputs.channel == 'beta' }}
          files: dist/ClipRelay-${{ steps.version.outputs.version }}.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Sparkle tools
        run: |
          SPARKLE_VERSION="2.9.0"
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" -o /tmp/sparkle.tar.xz
          mkdir -p /tmp/sparkle-tools
          tar xf /tmp/sparkle.tar.xz -C /tmp/sparkle-tools

      - name: Generate Sparkle EdDSA signature
        id: sparkle-sign
        run: |
          DMG="dist/ClipRelay-${{ steps.version.outputs.version }}.dmg"
          DMG_SIZE=$(stat -f%z "$DMG")
          KEY_FILE=$(mktemp)
          echo "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          RAW=$(/tmp/sparkle-tools/bin/sign_update "$DMG" -f "$KEY_FILE")
          rm -f "$KEY_FILE"
          SIGNATURE=$(echo "$RAW" | sed -E 's/^sparkle:edSignature=//; s/ length=.*//')
          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"
          echo "size=$DMG_SIZE" >> "$GITHUB_OUTPUT"

      - name: Compute build metadata
        id: build-meta
        run: |
          echo "build_number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "git_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Update Sparkle appcast on sparkle branch
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          TAG="${{ steps.channel.outputs.tag_prefix }}${VER}"
          URL="https://github.com/geekflyer/cliprelay/releases/download/${TAG}/ClipRelay-${VER}.dmg"
          CH='${{ steps.channel.outputs.channel }}'

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin sparkle
          git worktree add /tmp/sparkle-branch origin/sparkle

          if [[ "$CH" == beta ]]; then
            APPCAST="/tmp/sparkle-branch/appcast-beta.xml"
            if [[ ! -f "$APPCAST" ]]; then
              if [[ -f /tmp/sparkle-branch/appcast.xml ]]; then
                cp /tmp/sparkle-branch/appcast.xml "$APPCAST"
              else
                cat > "$APPCAST" << 'XMLEOF'
<?xml version="1.0" encoding="utf-8"?>
<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
    <channel>
        <title>ClipRelay Beta</title>
        <description>Beta updates for ClipRelay (Sparkle).</description>
        <language>en</language>
    </channel>
</rss>
XMLEOF
              fi
            fi
          else
            APPCAST="/tmp/sparkle-branch/appcast.xml"
          fi

          ./scripts/update-appcast.sh \
            --appcast "$APPCAST" \
            --version "${VER} (${{ steps.build-meta.outputs.git_hash }})" \
            --build-number "${{ steps.build-meta.outputs.build_number }}" \
            --signature "${{ steps.sparkle-sign.outputs.signature }}" \
            --size "${{ steps.sparkle-sign.outputs.size }}" \
            --url "$URL"

          cd /tmp/sparkle-branch
          git add "$(basename "$APPCAST")"
          git commit -m "update $(basename "$APPCAST") for ${{ steps.channel.outputs.channel }} v${VER}"
          git push origin HEAD:sparkle
          cd -
          git worktree remove /tmp/sparkle-branch
