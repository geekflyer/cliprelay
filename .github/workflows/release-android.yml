name: Release Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (stable X.Y.Z on main, or X.Y.Z-beta.N on beta)'
        type: string
        required: false
      promote:
        description: 'Promote from internal to production'
        type: boolean
        default: false
      play_track:
        description: 'Play track when releasing from beta (internal or beta / open testing)'
        type: choice
        options:
          - internal
          - beta
        default: internal

permissions:
  contents: write

jobs:
  release:
    if: inputs.version != '' && !inputs.promote
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve channel from branch
        id: channel
        run: |
          BR="${{ github.ref_name }}"
          case "$BR" in
            main)
              echo "channel=stable" >> "$GITHUB_OUTPUT"
              echo "tag_prefix=android/v" >> "$GITHUB_OUTPUT"
              ;;
            beta)
              echo "channel=beta" >> "$GITHUB_OUTPUT"
              echo "tag_prefix=android/beta/v" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Error: Release Android is only supported from branches main or beta (currently '$BR')." >&2
              exit 1
              ;;
          esac

      - name: Validate version for channel
        run: |
          V="${{ inputs.version }}"
          CH='${{ steps.channel.outputs.channel }}'
          if [[ "$CH" == stable ]]; then
            if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Error: Stable version must be semver X.Y.Z (no pre-release suffix)." >&2
              exit 1
            fi
          else
            if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'; then
              echo "Error: Beta version must be X.Y.Z-beta.N (e.g. 1.2.0-beta.3)." >&2
              exit 1
            fi
          fi

      - name: Set Play track
        id: play
        run: |
          CH='${{ steps.channel.outputs.channel }}'
          if [[ "$CH" == stable ]]; then
            echo "track=production" >> "$GITHUB_OUTPUT"
          else
            echo "track=${{ inputs.play_track }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version
        id: version
        run: echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Verify tag does not exist
        run: |
          TAG="${{ steps.channel.outputs.tag_prefix }}${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Error: Tag $TAG already exists" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          KEYSTORE_BASE64: op://cliprelay/Android Keystore/keystore-base64
          KEYSTORE_PASSWORD: op://cliprelay/Android Keystore/password
          KEY_ALIAS: op://cliprelay/Android Keystore/key-alias
          KEY_PASSWORD: op://cliprelay/Android Keystore/key-password
          PLAY_SERVICE_ACCOUNT_JSON: op://cliprelay/Android Play Store/service-account-json

      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/cliprelay-release.keystore

      - name: Create keystore.properties
        run: |
          cat > android/keystore.properties <<PROPS
          storeFile=cliprelay-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Create play.properties
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > android/play-service-account.json
          echo "serviceAccountCredentials=play-service-account.json" > android/play.properties

      - name: Build release
        run: ./scripts/build-all.sh --android-only --release

      - name: Publish to Play track
        run: ./scripts/publish-android.sh --track "${{ steps.play.outputs.track }}"

      - name: Generate changelog
        id: changelog
        run: |
          CH='${{ steps.channel.outputs.channel }}'
          if [[ "$CH" == stable ]]; then
            PREV=$(git tag -l 'android/v*' --sort=-v:refname | grep -v '^android/beta/' | head -1 || true)
          else
            PREV=$(git tag -l 'android/beta/v*' --sort=-v:refname | head -1 || true)
          fi
          if [[ -n "$PREV" ]]; then
            BODY=$(./scripts/changelog.sh --android "${PREV}..HEAD")
          else
            BODY="- Initial release"
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          TAG="${{ steps.channel.outputs.tag_prefix }}${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Android release ${{ steps.channel.outputs.channel }} ${{ steps.version.outputs.version }}"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.channel.outputs.tag_prefix }}${{ steps.version.outputs.version }}
          name: ${{ steps.channel.outputs.channel == 'beta' && format('Android beta v{0}', steps.version.outputs.version) || format('Android v{0}', steps.version.outputs.version) }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ steps.channel.outputs.channel == 'beta' }}
          files: dist/cliprelay-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.promote && github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          PLAY_SERVICE_ACCOUNT_JSON: op://cliprelay/Android Play Store/service-account-json

      - name: Create play.properties
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > android/play-service-account.json
          echo "serviceAccountCredentials=play-service-account.json" > android/play.properties

      - name: Promote to production
        run: ./scripts/publish-android.sh --promote --from internal --to production
